name: Remediação segura de dependências

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dependency-remediation.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

concurrency:
  group: dependency-remediation-main
  cancel-in-progress: false

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply non-breaking security fixes (major updates remain pending)
        id: audit_fix
        continue-on-error: true
        run: npm audit fix --no-fund --no-progress

      - name: Verify lockfile remains installable
        run: npm ci

      - name: Generate Prisma Client
        run: npx --yes prisma@6.19.3 generate

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npx vitest run --reporter=verbose

      - name: Production build
        run: npx next build --webpack
        env:
          DATABASE_URL: "file:./dev.db"
          JWT_SECRET: "ci-e2e-HS256-7f9a2c4d8b6e1f0a3c5d"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"

      - name: Report remaining production advisories
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Commit verified dependency updates to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "fix: atualizar dependências vulneráveis sem major"
          git push origin HEAD:main
